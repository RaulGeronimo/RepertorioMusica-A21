@if(loading.cargando()){
<div class="position-fixed top-0 start-0 end-0 bottom-0 d-flex align-items-center justify-content-center bg-dark bg-opacity-50"
    style="z-index: 1080; backdrop-filter: blur(4px);">
    <div class="d-flex flex-column align-items-center gap-3">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="text-white small fw-medium mb-0">Cargando...</p>
    </div>
</div>
}
